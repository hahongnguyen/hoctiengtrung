<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hán ngữ nhập môn – Học chữ Hán dễ nhớ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<style>
:root{--ink:#1B2B3A;--jade:#1E8A7A;--jade-d:#146356;--slate:#5B6B7A;--line:#D9E2E8;--bg:#F4F7F9;--bad:#B4452F}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
.brand{font-weight:600}
main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--jade)}
.btn.main{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.main:hover{background:var(--jade-d)}
:focus-visible{outline:3px solid #7FD1C5;outline-offset:2px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs .btn{flex:1}
.tabs .btn[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.top{text-align:center}
.hanzi{font:600 clamp(56px,18vw,84px)/1.2 "Noto Serif SC",serif}
.pinyin{font-size:22px;color:var(--jade-d)}
.meaning{font-size:19px}
.hv{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:99px;background:#E6F4F1;color:var(--jade-d);font-size:14px}
.muted{color:var(--slate);font-size:14px;margin:0}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:4px}
.tag.n{background:#E6F4F1;color:var(--jade-d)}
.tag.m{background:#FDF0D8;color:#8A5A00}
#note p{margin:4px 0 0}
.chips{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.ch{font:600 24px "Noto Serif SC",serif;min-width:48px;padding:4px 10px}
.ch.on{border-color:var(--jade);background:#E6F4F1}
#wbox{width:200px;height:200px;margin:0 auto;border:1px dashed var(--line);border-radius:12px;touch-action:none}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left}
.opt.big{font:600 28px "Noto Serif SC",serif;text-align:center}
.opt.right{border-color:var(--jade);background:#E6F4F1}
.opt.wrong{border-color:var(--bad);background:#FBEAE6}
.qh{font:600 56px/1.2 "Noto Serif SC",serif;margin:8px 0;text-align:center}
.qm{font-size:24px;text-align:center;margin:12px 0}
.score{font-size:48px;font-weight:600;text-align:center;margin:12px 0}
footer{text-align:center;margin-top:24px}
</style>
</head>
<body>
<header><span class="brand">Hán ngữ nhập môn</span><span class="muted" id="streak"></span></header>
<main>
  <div class="row"><label for="lesson" class="muted">Chọn bài</label><select id="lesson" class="btn"></select></div>
  <div class="tabs" role="tablist">
    <button class="btn" role="tab" id="tL" aria-selected="true">Học từ</button>
    <button class="btn" role="tab" id="tQ" aria-selected="false">Quiz</button>
  </div>

  <section id="learn">
    <div class="box top">
      <div class="hanzi" id="hanzi"></div>
      <div class="pinyin" id="pinyin"></div>
      <div class="meaning" id="meaning"></div>
      <span class="hv" id="hv"></span>
      <div class="row" style="justify-content:center;margin-top:10px"><button id="say" class="btn">Nghe phát âm</button></div>
    </div>
    <div class="box" id="note"><span class="tag" id="tag"></span><p id="ntext"></p></div>
    <div class="box top">
      <p class="muted" style="margin-bottom:8px">Tập viết từng nét</p>
      <div class="chips" id="chars"></div>
      <div id="wbox"></div>
      <p class="muted" id="werr" role="status" style="margin-top:6px;min-height:22px"></p>
      <div class="row" style="justify-content:center"><button id="anim" class="btn">Xem thứ tự nét</button><button id="tryw" class="btn main">Tự viết</button></div>
    </div>
    <div class="row" style="justify-content:space-between;margin:12px 0 4px"><span class="muted" id="count"></span><span class="muted" id="known"></span></div>
    <div class="row"><button id="prev" class="btn">Trước</button><button id="no" class="btn">Chưa thuộc</button><button id="yes" class="btn main">Đã thuộc</button><button id="next" class="btn">Sau</button></div>
  </section>

  <section id="qz" hidden><div class="box" id="quiz"></div></section>
  <footer class="muted">Hình nét chữ: thư viện Hanzi Writer (mã nguồn mở)</footer>
</main>

<script>
/* Mỗi dòng:  chữ Hán|pinyin|nghĩa|Hán Việt|loại (n = nguồn gốc, m = mẹo nhớ)|ghi chú. Phần sau nghĩa có thể bỏ trống. */
const RAW = `我|wǒ|tôi|ngã
你|nǐ|bạn|nhĩ
他|tā|anh ấy|tha|n|Bộ 亻 là người, 也 gợi âm “tā”.
她|tā|cô ấy|tha|n|Bộ 女 (phụ nữ) + 也: dùng cho nữ giới.
我们|wǒmen|chúng tôi|ngã môn
你们|nǐmen|các bạn|nhĩ môn
他们|tāmen|họ|tha môn
这|zhè|này
那|nà|kia
谁|shéi|ai|thùy
什么|shénme|cái gì
哪|nǎ|nào
几|jǐ|mấy
多少|duōshao|bao nhiêu
怎么|zěnme|thế nào
一|yī|một|nhất|n|Một vạch ngang = một.
二|èr|hai|nhị|n|Hai vạch ngang = hai.
三|sān|ba|tam|n|Ba vạch ngang = ba.
四|sì|bốn|tứ
五|wǔ|năm|ngũ
六|liù|sáu|lục
七|qī|bảy|thất
八|bā|tám|bát|m|Hai nét tách ra hai bên như đang “chia” ra.
九|jiǔ|chín|cửu
十|shí|mười|thập|m|Dấu cộng đầy đủ nét ngang dọc = mười.
你好|nǐ hǎo|xin chào
谢谢|xièxie|cảm ơn|tạ tạ|n|Bộ 讠 là lời nói: cảm ơn bằng lời.
不客气|bú kèqi|không có gì|bất khách khí
对不起|duìbuqǐ|xin lỗi|đối bất khởi
没关系|méi guānxi|không sao đâu|một quan hệ
再见|zàijiàn|tạm biệt|tái kiến
请|qǐng|xin mời|thỉnh|n|Bộ 讠 (lời nói) + 青 gợi âm: mời bằng lời.
好|hǎo|tốt|hảo|n|女 (phụ nữ) + 子 (con): người mẹ có con là điều tốt đẹp.
是|shì|là|thị
不|bù|không|bất
没有|méiyǒu|không có|một hữu
有|yǒu|có|hữu
爱|ài|yêu|ái|n|Chữ phồn thể 愛 có 心 (tim) ở giữa; giản thể đã bỏ mất “tim”.
喜欢|xǐhuan|thích|hỉ hoan
想|xiǎng|muốn, nhớ|tưởng|n|Có 心 (tim) ở dưới: liên quan đến suy nghĩ, tình cảm.
吃|chī|ăn||n|Bộ 口 (miệng): việc làm bằng miệng.
喝|hē|uống||n|Bộ 口 (miệng) giống 吃: uống bằng miệng.
看|kàn|xem, nhìn|khán|n|手 (tay) đặt trên 目 (mắt): đưa tay che mắt để nhìn xa.
听|tīng|nghe|thính
说|shuō|nói|thuyết|n|Bộ 讠 là lời nói.
读|dú|đọc|độc|n|Bộ 讠 là lời nói: đọc thành tiếng.
写|xiě|viết|tả
学习|xuéxí|học tập|học tập
去|qù|đi|khứ
来|lái|đến|lai
回|huí|về|hồi|m|Vòng trong vòng như quay trở lại điểm xuất phát.
买|mǎi|mua|mãi
做|zuò|làm
坐|zuò|ngồi|tọa|n|Hai người 人 人 ngồi trên đất 土.
住|zhù|ở, sống|trú|n|Bộ 亻 (người) + 主: người ở lại một chỗ.
叫|jiào|gọi, tên là|khiếu
认识|rènshi|quen biết|nhận thức
工作|gōngzuò|công việc|công tác
爸爸|bàba|bố
妈妈|māma|mẹ||n|Bộ 女 (nữ giới) + 马 gợi âm “mā”.
儿子|érzi|con trai|nhi tử
女儿|nǚ’ér|con gái|nữ nhi
朋友|péngyou|bạn bè|bằng hữu
老师|lǎoshī|giáo viên|lão sư
学生|xuésheng|học sinh|học sinh
医生|yīshēng|bác sĩ|y sinh
人|rén|người|nhân|n|Hình người đứng nhìn nghiêng.
水|shuǐ|nước|thủy|n|Hình dòng nước chảy, giọt nước bắn ra hai bên.
茶|chá|trà|trà|m|Cỏ 艹 ở trên, người 人 ở giữa, cây 木 ở dưới: người ngồi uống trà giữa cây cỏ.
米饭|mǐfàn|cơm|mễ phạn
苹果|píngguǒ|quả táo|bình quả
水果|shuǐguǒ|trái cây|thủy quả
菜|cài|món ăn, rau||n|Bộ 艹 (cỏ, rau) ở trên.
钱|qián|tiền|tiền|n|Bộ 钅 (kim loại): ngày xưa tiền làm bằng kim loại.
家|jiā|nhà|gia|n|宀 (mái nhà) + 豕 (con heo): nhà có nuôi heo.
学校|xuéxiào|trường học|học hiệu
中国|Zhōngguó|Trung Quốc|Trung Quốc
今天|jīntiān|hôm nay|kim thiên
明天|míngtiān|ngày mai|minh thiên|n|Chữ 明 = 日 (mặt trời) + 月 (mặt trăng): sáng sủa.
昨天|zuótiān|hôm qua|tạc thiên
天气|tiānqì|thời tiết|thiên khí
大|dà|to, lớn|đại|n|Hình người dang rộng hai tay: to lớn.
小|xiǎo|nhỏ|tiểu|m|Ba nét như ba hạt nhỏ li ti.
多|duō|nhiều|đa|n|Hai chữ 夕 (buổi tối) chồng lên nhau: nhiều đêm trôi qua nên là nhiều.
少|shǎo|ít|thiểu|m|Chữ 小 bị “bớt” đi một nét phẩy.
热|rè|nóng|nhiệt|n|Bốn chấm 灬 (lửa) ở dưới: nóng.
冷|lěng|lạnh|lãnh|n|Bộ 冫 là băng giá, 令 gợi âm.
高兴|gāoxìng|vui|cao hứng
漂亮|piàoliang|đẹp|phiêu lượng`;

const W = RAW.trim().split("\n").map(l => { const [h, p, m, hv, t, n] = l.split("|"); return { h, p, m, hv, t, n }; });
const PER = 10, LESSONS = Math.ceil(W.length / PER);
const $ = id => document.getElementById(id);
const rnd = a => [...a].sort(() => Math.random() - .5);
const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let known = new Set(get("hsk1_known", [])), st = get("hsk1_streak", { n: 0, last: "" });
let lesson = -1, i = 0, wr = null;
const deck = () => lesson < 0 ? W : W.slice(lesson * PER, (lesson + 1) * PER);

function bump() {
  const t = new Date().toDateString();
  if (st.last === t) return;
  st.n = st.last === new Date(Date.now() - 864e5).toDateString() ? st.n + 1 : 1;
  st.last = t; put("hsk1_streak", st); showStreak();
}
function showStreak() { $("streak").textContent = st.n ? `Chuỗi ${st.n} ngày học` : ""; }

$("lesson").innerHTML = `<option value="-1">Tất cả (${W.length} từ)</option>` +
  Array.from({ length: LESSONS }, (_, n) => `<option value="${n}">Bài ${n + 1} (từ ${n * PER + 1}–${Math.min((n + 1) * PER, W.length)})</option>`).join("");
$("lesson").onchange = e => { lesson = +e.target.value; i = 0; learn(); startQuiz(); };

let zhVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
const ttsAudio = new Audio();
ttsAudio.preload = "auto";
function ttsUrls(t) {
  const q = encodeURIComponent(t);
  return [
    "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=" + q,
    "https://fanyi.baidu.com/gettts?lan=zh&spd=4&source=web&text=" + q,
    "https://dict.youdao.com/dictvoice?audio=" + q + "&le=zh"
  ];
}
let ttsToken = 0;
function speakFallback(t) {
  // Máy không có giọng Trung: thử lần lượt các nguồn âm thanh qua mạng
  const urls = ttsUrls(t);
  const my = ++ttsToken;
  let k = 0;
  const tryNext = () => {
    if (my !== ttsToken || k >= urls.length) return; // hết nguồn thì im lặng
    const idx = k;
    let advanced = false;
    const fail = () => {
      if (advanced || my !== ttsToken || idx !== k) return;
      advanced = true; k++; tryNext();
    };
    ttsAudio.onerror = fail;
    ttsAudio.src = urls[idx];
    const pr = ttsAudio.play();
    if (pr && pr.catch) pr.catch(e => {
      if (e && e.name === "AbortError") return; // bị ngắt do đổi nguồn, bỏ qua
      fail();
    });
  };
  tryNext();
}
function speak(t) {
  if (!("speechSynthesis" in window)) return speakFallback(t);
  if (!zhVoice) pickVoice();
  if (!zhVoice) return speakFallback(t);
  const u = new SpeechSynthesisUtterance(t);
  u.lang = zhVoice.lang; u.voice = zhVoice; u.rate = .8; u.volume = 1;
  speechSynthesis.cancel();
  speechSynthesis.resume();
  setTimeout(() => speechSynthesis.speak(u), 60);
}

/* ----- học từ ----- */
function learn() {
  const d = deck(), w = d[i];
  $("hanzi").textContent = w.h; $("pinyin").textContent = w.p; $("meaning").textContent = w.m;
  $("hv").hidden = !w.hv; $("hv").textContent = "Hán Việt: " + (w.hv || "");
  $("note").hidden = !w.n;
  if (w.n) { $("tag").textContent = w.t === "n" ? "Nguồn gốc" : "Mẹo nhớ"; $("tag").className = "tag " + w.t; $("ntext").textContent = w.n; }
  $("chars").innerHTML = [...w.h].map((c, k) => `<button class="btn ch" data-k="${k}">${c}</button>`).join("");
  $("chars").querySelectorAll(".ch").forEach(b => b.onclick = () => draw(+b.dataset.k));
  $("count").textContent = `Từ ${i + 1}/${d.length}`;
  $("known").textContent = `Đã thuộc ${d.filter(x => known.has(x.h)).length}/${d.length}`;
  draw(0);
}
function draw(k) {
  const c = [...deck()[i].h][k];
  $("chars").querySelectorAll(".ch").forEach((b, n) => b.classList.toggle("on", n === k));
  if (wr) { try { wr.cancelQuiz(); } catch (e) {} }
  $("wbox").innerHTML = ""; $("werr").textContent = "";
  if (!window.HanziWriter) { $("werr").textContent = "Không tải được công cụ viết nét. Hãy kiểm tra kết nối Internet."; return; }
  wr = HanziWriter.create($("wbox"), c, {
    width: 200, height: 200, padding: 10, strokeColor: "#1B2B3A", outlineColor: "#D9E2E8", radicalColor: "#1E8A7A",
    onLoadCharDataError: () => { $("werr").textContent = "Chưa có dữ liệu nét cho chữ này."; }
  });
  wr.animateCharacter();
}
$("anim").onclick = () => { if (wr) { try { wr.cancelQuiz(); } catch (e) {} $("werr").textContent = ""; wr.animateCharacter(); } };
$("tryw").onclick = () => {
  if (!wr) return;
  $("werr").textContent = "Hãy vẽ từng nét theo thứ tự. Sai nét sẽ được gợi ý.";
  wr.quiz({ onComplete: () => { $("werr").textContent = "Giỏi lắm, bạn đã viết đúng hết các nét!"; bump(); } });
};
function go(s) { const n = deck().length; i = (i + s + n) % n; learn(); }
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("say").onclick = () => speak(deck()[i].h);
$("yes").onclick = () => { known.add(deck()[i].h); put("hsk1_known", [...known]); bump(); go(1); };
$("no").onclick = () => { known.delete(deck()[i].h); put("hsk1_known", [...known]); go(1); };

/* ----- quiz: chữ → nghĩa, hoặc nghĩa → chữ ----- */
let Q = [], qi = 0, score = 0;
function startQuiz() {
  Q = rnd(deck()).slice(0, 10).map(w => ({ w, rev: Math.random() < .5, opts: rnd([w, ...rnd(W.filter(x => x.m !== w.m)).slice(0, 3)]) }));
  qi = 0; score = 0; showQ();
}
function showQ() {
  const box = $("quiz");
  if (qi >= Q.length) {
    box.innerHTML = `<p class="score">${score}/${Q.length}</p><p class="muted" style="text-align:center">${score === Q.length ? "Tuyệt vời, bạn đúng hết!" : "Hãy xem lại các từ chưa chắc ở tab Học từ rồi làm lại nhé."}</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn main" id="again">Làm lại</button></div>`;
    $("again").onclick = startQuiz; return;
  }
  const q = Q[qi];
  box.innerHTML = `<p class="muted">Câu ${qi + 1}/${Q.length}</p>` +
    (q.rev ? `<div class="qm">Chọn chữ có nghĩa: <b>${q.w.m}</b></div>`
           : `<div class="qh">${q.w.h}</div><div class="row" style="justify-content:center"><button class="btn" id="qsay">Nghe phát âm</button></div>`) +
    `<div class="opts">${q.opts.map((o, n) => `<button class="btn opt${q.rev ? " big" : ""}" data-n="${n}">${q.rev ? o.h : o.m}</button>`).join("")}</div>
    <p class="muted" id="fb" role="status"></p><div class="row" id="nxt"></div>`;
  if (!q.rev) $("qsay").onclick = () => speak(q.w.h);
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = q.opts[+b.dataset.n] === q.w;
    box.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (q.opts[+x.dataset.n] === q.w) x.classList.add("right"); });
    if (ok) score++; else b.classList.add("wrong");
    bump();
    $("fb").textContent = `${ok ? "Chính xác!" : "Chưa đúng."} ${q.w.h} (${q.w.p}) nghĩa là ${q.w.m}.`;
    $("nxt").innerHTML = `<button class="btn main" id="go">${qi + 1 < Q.length ? "Câu tiếp" : "Xem kết quả"}</button>`;
    $("go").onclick = () => { qi++; showQ(); };
  });
}

function tab(t) {
  $("learn").hidden = t !== "L"; $("qz").hidden = t !== "Q";
  $("tL").setAttribute("aria-selected", t === "L"); $("tQ").setAttribute("aria-selected", t === "Q");
}
$("tL").onclick = () => tab("L");
$("tQ").onclick = () => tab("Q");

showStreak(); learn(); startQuiz();
</script>
</body>
</html>
